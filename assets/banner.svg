<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Radoslav Kolchev — building AI voice agents at PrismAI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b09"/>
      <stop offset="1" stop-color="#17130f"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset="0.2" stop-color="#ffb347"/>
      <stop offset="0.4" stop-color="#ffe66d"/>
      <stop offset="0.6" stop-color="#5ef2a0"/>
      <stop offset="0.8" stop-color="#5ab8ff"/>
      <stop offset="1" stop-color="#b98cff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace; }
      .bar  { fill: url(#prism); }
    </style>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <clipPath id="card"><rect width="900" height="300" rx="18"/></clipPath>
  <rect x="0" y="0" width="900" height="3" fill="url(#prism)" clip-path="url(#card)"/>

  <!-- little prism: white beam in, spectrum out -->
  <g transform="translate(56 48)">
    <rect x="-16" y="15" width="20" height="2" fill="url(#beam)"/>
    <path d="M4 30 L16 4 L28 30 Z" fill="none" stroke="#e9e3da" stroke-width="1.6" stroke-linejoin="round"/>
    <g opacity="0.9">
      <path d="M22 17 L44 10" stroke="#ff5f6d" stroke-width="1.6"/>
      <path d="M22 18 L44 15" stroke="#ffe66d" stroke-width="1.6"/>
      <path d="M22 19 L44 20" stroke="#5ef2a0" stroke-width="1.6"/>
      <path d="M22 20 L44 25" stroke="#5ab8ff" stroke-width="1.6"/>
      <path d="M22 21 L44 30" stroke="#b98cff" stroke-width="1.6"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>
  <text x="112" y="72" class="mono" font-size="12" fill="#8a8076" letter-spacing="2">PRISMAI SOLUTIONS</text>

  <!-- left: who -->
  <text x="56" y="128" class="sans" font-size="40" font-weight="800" fill="#f4efe8">Radoslav Kolchev</text>
  <text x="56" y="166" class="sans" font-size="21" font-weight="600" fill="url(#prism)">Voice AI that runs the phones.</text>
  <text x="56" y="193" class="sans" font-size="21" font-weight="600" fill="#f4efe8">72 languages. 24/7. Zero hold time.</text>
  <text x="56" y="234" class="mono" font-size="13" fill="#8a8076">&gt; reception · support · sales · scheduling · CRM</text>
  <text x="56" y="258" class="mono" font-size="13" fill="#8a8076">&gt; built solo · trusted by Toyota<tspan fill="#5ef2a0">▌<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- right: live call card -->
  <g transform="translate(560 40)">
    <rect width="300" height="220" rx="14" fill="#1b1612" stroke="#2e2620"/>
    <circle cx="20" cy="22" r="4" fill="#ff5f6d"><animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="32" y="26" class="mono" font-size="11" fill="#c9bfb3" letter-spacing="1">LIVE CALL</text>
    <text x="282" y="26" class="mono" font-size="11" fill="#6f655b" text-anchor="end">AI agent</text>

    <!-- waveform -->
    <g transform="translate(20 46)">
      <rect class="bar" x="0"   y="14" width="6" height="12" rx="3"><animate attributeName="height" values="6;30;10;22;6" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="17;5;15;9;17" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect class="bar" x="11"  y="14" width="6" height="12" rx="3"><animate attributeName="height" values="20;8;34;12;20" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="10;16;3;14;10" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect class="bar" x="22"  y="14" width="6" height="12" rx="3"><animate attributeName="height" values="10;36;14;26;10" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="15;2;13;7;15" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect class="bar" x="33"  y="14" width="6" height="12" rx="3"><animate attributeName="height" values="28;10;22;6;28" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="6;15;9;17;6" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect class="bar" x="44"  y="14" width="6" height="12" rx="3"><animate attributeName="height" values="8;24;36;12;8" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="16;8;2;14;16" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect class="bar" x="55"  y="14" width="6" height="12" rx="3"><animate attributeName="height" values="16;32;8;20;16" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="12;4;16;10;12" dur="1s" repeatCount="indefinite"/></rect>
      <rect class="bar" x="66"  y="14" width="6" height="12" rx="3"><animate attributeName="height" values="30;12;24;8;30" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="5;14;8;16;5" dur="1.25s" repeatCount="indefinite"/></rect>
      <rect class="bar" x="77"  y="14" width="6" height="12" rx="3"><animate attributeName="height" values="12;26;10;34;12" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="14;7;15;3;14" dur="0.95s" repeatCount="indefinite"/></rect>
      <rect class="bar" x="88"  y="14" width="6" height="12" rx="3"><animate attributeName="height" values="22;6;30;14;22" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="9;17;5;13;9" dur="1.15s" repeatCount="indefinite"/></rect>
      <rect class="bar" x="99"  y="14" width="6" height="12" rx="3"><animate attributeName="height" values="6;20;28;10;6" dur="1.35s" repeatCount="indefinite"/><animate attributeName="y" values="17;10;6;15;17" dur="1.35s" repeatCount="indefinite"/></rect>
      <rect class="bar" x="110" y="14" width="6" height="12" rx="3"><animate attributeName="height" values="18;34;12;24;18" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="11;3;14;8;11" dur="1.05s" repeatCount="indefinite"/></rect>
      <rect class="bar" x="121" y="14" width="6" height="12" rx="3"><animate attributeName="height" values="26;10;20;6;26" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="7;15;10;17;7" dur="1.2s" repeatCount="indefinite"/></rect>
      <text x="260" y="25" class="mono" font-size="11" fill="#6f655b" text-anchor="end">00:14</text>
    </g>

    <!-- transcript -->
    <g class="sans" font-size="12.5">
      <rect x="20" y="96" width="266" height="30" rx="10" fill="#2a221b"/>
            <g opacity="0"><text x="32" y="115" fill="#f4efe8">🤖 Здравейте! С какво да помогна?</text><text x="278" y="115" class="mono" font-size="10" fill="#6f655b" text-anchor="end">bg</text><animate attributeName="opacity" values="1;0;0;0;0;0;0;0" dur="9.6s" calcMode="discrete" repeatCount="indefinite"/></g>
      <g opacity="0"><text x="32" y="115" fill="#f4efe8">🤖 Hi! How can I help you today?</text><text x="278" y="115" class="mono" font-size="10" fill="#6f655b" text-anchor="end">en</text><animate attributeName="opacity" values="0;1;0;0;0;0;0;0" dur="9.6s" calcMode="discrete" repeatCount="indefinite"/></g>
      <g opacity="0"><text x="32" y="115" fill="#f4efe8">🤖 ¡Hola! ¿En qué puedo ayudarle?</text><text x="278" y="115" class="mono" font-size="10" fill="#6f655b" text-anchor="end">es</text><animate attributeName="opacity" values="0;0;1;0;0;0;0;0" dur="9.6s" calcMode="discrete" repeatCount="indefinite"/></g>
      <g opacity="0"><text x="32" y="115" fill="#f4efe8">🤖 Bonjour ! Comment puis-je aider ?</text><text x="278" y="115" class="mono" font-size="10" fill="#6f655b" text-anchor="end">fr</text><animate attributeName="opacity" values="0;0;0;1;0;0;0;0" dur="9.6s" calcMode="discrete" repeatCount="indefinite"/></g>
      <g opacity="0"><text x="32" y="115" fill="#f4efe8">🤖 Hallo! Wie kann ich helfen?</text><text x="278" y="115" class="mono" font-size="10" fill="#6f655b" text-anchor="end">de</text><animate attributeName="opacity" values="0;0;0;0;1;0;0;0" dur="9.6s" calcMode="discrete" repeatCount="indefinite"/></g>
      <g opacity="0"><text x="32" y="115" fill="#f4efe8">🤖 Ciao! Come posso aiutarla?</text><text x="278" y="115" class="mono" font-size="10" fill="#6f655b" text-anchor="end">it</text><animate attributeName="opacity" values="0;0;0;0;0;1;0;0" dur="9.6s" calcMode="discrete" repeatCount="indefinite"/></g>
      <g opacity="0"><text x="32" y="115" fill="#f4efe8">🤖 Merhaba! Nasıl yardımcı olabilirim?</text><text x="278" y="115" class="mono" font-size="10" fill="#6f655b" text-anchor="end">tr</text><animate attributeName="opacity" values="0;0;0;0;0;0;1;0" dur="9.6s" calcMode="discrete" repeatCount="indefinite"/></g>
      <g opacity="0"><text x="32" y="115" fill="#f4efe8">🤖 Γεια σας! Πώς μπορώ να βοηθήσω;</text><text x="278" y="115" class="mono" font-size="10" fill="#6f655b" text-anchor="end">el</text><animate attributeName="opacity" values="0;0;0;0;0;0;0;1" dur="9.6s" calcMode="discrete" repeatCount="indefinite"/></g>
      <rect x="70" y="134" width="216" height="30" rx="10" fill="#22303a"/>
      <text x="82" y="153" fill="#e3f1fb">👤 Can I move it to Friday?</text>
      <rect x="20" y="176" width="200" height="26" rx="13" fill="#123222" stroke="#5ef2a0" stroke-opacity="0.5"/>
      <text x="34" y="193" class="mono" font-size="11" fill="#5ef2a0">✓ rescheduled · CRM updated<animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/></text>
    </g>
  </g>
</svg>
